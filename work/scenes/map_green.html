<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../lib/style.css">
<style>
  #stage { background: #071C18; }
  canvas { position: absolute; left: 0; top: 0; }
  .lbl { position: absolute; white-space: nowrap; font: 700 46px "MV Typewriter"; color: #fff; direction: rtl;
         text-shadow: 0 3px 14px rgba(0,0,0,.65), 0 0 2px rgba(0,0,0,.5); }
  #panel { position: absolute; right: 140px; top: 150px; width: 600px; text-align: right; direction: rtl; }
  #big { font: 700 160px/1 "MV MAG Round"; color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.45); }
  #big b { font: 700 160px/1 Inter; margin-left: 28px; }
  #rule { width: 96px; height: 5px; background: #E7B54B; margin: 34px 0 30px auto; transform-origin: right; }
  .row { font: 700 33px/1.6 "MV Typewriter"; color: #F4F1E8; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .row i { display: inline-block; width: 13px; height: 13px; border-radius: 50%; background: #E7B54B; margin-left: 16px; vertical-align: middle; }
  #shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(4,20,16,0) 40%, rgba(4,20,16,.6) 100%); opacity: 0; }
</style></head>
<body><div id="stage">
<canvas id="cv"></canvas>
<div style="position:absolute;inset:0;opacity:.5;background-image:linear-gradient(rgba(95,224,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(95,224,255,.07) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(70% 70% at 50% 50%,#000 30%,transparent 100%)"></div>
<div id="shade"></div>
<div id="labels"></div>
<div id="panel"><div id="big"><b>10</b>ރަށް</div><div id="rule"></div><div id="list"></div></div>
</div>
<script src="../lib/core.js"></script>
<script src="../data/maldives.js"></script>
<script>
const W = 1920, H = 1080, DPR = window.devicePixelRatio || 1;
const cv = document.getElementById("cv"); cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + "px"; cv.style.height = H + "px";
const ctx = cv.getContext("2d");
const CX = 860, CY = 540;

// ---------- static layers built once ----------
// ocean: deep gradient + fine noise + vignette (screen space)
const ocean = document.createElement("canvas"); ocean.width = W * DPR; ocean.height = H * DPR;
{ const g = ocean.getContext("2d"); g.scale(DPR, DPR);
  const gr = g.createRadialGradient(W * .45, H * .45, 100, W * .5, H * .5, W * .8);
  gr.addColorStop(0, "#12463E"); gr.addColorStop(.55, "#0C3029"); gr.addColorStop(1, "#071C18");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const r = rng(3); g.globalAlpha = .05;
  for (let i = 0; i < 60000; i++) { g.fillStyle = r() < .5 ? "#ffffff" : "#000000"; g.fillRect(r() * W, r() * H, 1.2, 1.2); }
  g.globalAlpha = 1; }

// shallows texture in geo space (lagoons, reef flats) — derived from real island outlines
const TX = { lon0: 72.4, lat0: 7.3, ppd: 520 };
const shallows = document.createElement("canvas");
shallows.width = Math.ceil(1.6 * TX.ppd); shallows.height = Math.ceil(8.2 * TX.ppd);
{ const g = shallows.getContext("2d");
  const P = ([lo, la]) => [(lo - TX.lon0) * TX.ppd, (TX.lat0 - la) * TX.ppd];
  const poly = (rings) => { g.beginPath(); rings.forEach(r => r.forEach((p, i) => { const [x, y] = P(p); i ? g.lineTo(x, y) : g.moveTo(x, y); })); };
  g.filter = "blur(13px)"; g.fillStyle = "rgba(50,170,155,.6)"; MV.lagoons.forEach(a => { poly([a]); g.fill(); });
  g.filter = "blur(6px)"; g.fillStyle = "rgba(80,215,200,.6)"; MV.glow.forEach(p => { poly([p[0]]); g.fill(); });
  g.filter = "blur(1.6px)"; g.fillStyle = "rgba(130,235,220,.8)"; MV.glowS.forEach(p => { poly([p[0]]); g.fill(); });
  g.filter = "none"; }

// ---------- camera ----------
const FULL = [3.25, 73.2, 118];
const CAM = [
  [0, 3.25, 73.2, 108], [3.6, ...FULL],
  [5.6, 5.48, 73.0, 330], [7.9, 5.48, 73.0, 330],            // R. Inguraidhoo
  [10.6, 0.40, 73.28, 640], [17.2, 0.40, 73.28, 640],        // Huvadhu: Gemanafushi, Hoandeddhoo, Fiyoaree
  [19.8, 2.96, 73.48, 520], [21.9, 2.96, 73.48, 520],        // M. Veyvah
  [24.0, 4.95, 73.40, 420], [26.1, 4.95, 73.40, 420],        // K. Kaashidhoo
  [28.0, 3.94, 73.44, 420], [30.1, 3.94, 73.44, 420],        // K. Maafushi
  [32.6, 6.76, 73.10, 330], [34.7, 6.76, 73.10, 330],        // HA. Baarah
  [37.4, 2.02, 73.45, 520], [39.5, 2.02, 73.45, 520],        // L. Isdhoo
  [41.6, 4.40, 73.55, 420], [43.7, 4.40, 73.55, 420],        // K. Thulusdhoo
  [45.9, ...FULL],
];
function camera(t) {
  let i = 0; while (i < CAM.length - 1 && t >= CAM[i + 1][0]) i++;
  if (i === CAM.length - 1) return CAM[i].slice(1);
  const [t0, a1, b1, k1] = CAM[i], [t1, a2, b2, k2] = CAM[i + 1], e = ease.inOut(clamp((t - t0) / (t1 - t0)));
  // long hops pull back mid-flight so the map doesn't smear past
  const dip = Math.max(0, Math.log(Math.hypot(a2 - a1, b2 - b1) * Math.min(k1, k2) / 700));
  return [lerp(a1, a2, e), lerp(b1, b2, e), Math.exp(lerp(Math.log(k1), Math.log(k2), e) - dip * Math.sin(Math.PI * e))];
}
const proj = (lat, lon, c) => [CX + (lon - c[1]) * c[2], CY + (c[0] - lat) * c[2]];

// ---------- islands, outlines, labels ----------
const SIDE = ["r", "r", "l", "br", "r", "r", "r", "r", "r", "r"];
const REVEAL = [5.9, 10.9, 13.1, 15.3, 20.1, 24.3, 28.3, 32.9, 37.7, 41.9];
const EXIT = [7.9, 17.2, 17.2, 17.2, 21.9, 26.1, 30.1, 34.7, 39.5, 43.7];
const labels = document.getElementById("labels");
const isl = MV.islands.map(([en, dv, lat, lon], i) => {
  const d = document.createElement("div"); d.className = "lbl"; d.textContent = dv; labels.appendChild(d);
  return { dv, lat, lon, lbl: d, t0: REVEAL[i], exit: EXIT[i], side: SIDE[i], atoll: MV.islandAtoll[i] };
});
// outline draw-on windows per atoll (first mention → leaving the region)
const OUT = {};
isl.forEach(o => { OUT[o.atoll] ||= { t0: o.t0 - .5, t1: o.exit }; OUT[o.atoll].t1 = Math.max(OUT[o.atoll].t1, o.exit); });
const atollLen = MV.atolls.map(a => a.reduce((s, p, i) => i ? s + Math.hypot(p[0] - a[i - 1][0], p[1] - a[i - 1][1]) : 0, 0));

const list = document.getElementById("list");
const rows = isl.map(o => { const d = document.createElement("div"); d.className = "row"; d.innerHTML = `<i></i>${o.dv}`; list.appendChild(d); return d; });
const T_TITLE = 46.3;
window.DURATION = 54;

function pathGeo(rings, c) { ctx.beginPath(); rings.forEach(r => r.forEach((p, i) => { const [x, y] = proj(p[1], p[0], c); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); })); }

window.render = function (t) {
  const c = camera(t), z = c[2] / FULL[2];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(ocean, 0, 0, W, H);
  // shallows texture, placed by camera
  const [sx, sy] = proj(TX.lat0, TX.lon0, c), sc = c[2] / TX.ppd;
  ctx.globalAlpha = ease.out(prog(t, .4, 1.6));
  ctx.drawImage(shallows, sx, sy, shallows.width * sc, shallows.height * sc);
  // islands: sand rim + vegetation
  ctx.globalAlpha = ease.out(prog(t, .8, 1.6));
  ctx.lineJoin = "round";
  pathGeo(MV.land.map(r => r), c);
  ctx.strokeStyle = "#F1E6C6"; ctx.lineWidth = Math.min(3, .9 + z * .25); ctx.stroke();
  ctx.fillStyle = "#8FE07A"; ctx.fill();
  ctx.globalAlpha = 1;

  // white atoll outlines draw on as each atoll is first mentioned
  for (const k in OUT) {
    const w = OUT[k], a = ease.inOut(prog(t, w.t0, 1.4)) * (1 - ease.out(prog(t, w.t1 + .2, .8)));
    if (a <= 0) continue;
    pathGeo([MV.atolls[k]], c);
    ctx.fillStyle = `rgba(255,255,255,${.07 * a})`; ctx.fill();
    const L = atollLen[k] * c[2] * 1.05;
    ctx.setLineDash([L * ease.inOut(prog(t, w.t0, 1.4)), L]); ctx.lineDashOffset = 0;
    ctx.strokeStyle = `rgba(111,227,255,${.95 * Math.min(1, a * 1.5)})`; ctx.lineWidth = 3.2;
    ctx.shadowColor = "rgba(95,224,255,.8)"; ctx.shadowBlur = 12; ctx.stroke();
    ctx.shadowBlur = 0; ctx.setLineDash([]);
  }

  // markers + labels
  isl.forEach(o => {
    const [x, y] = proj(o.lat, o.lon, c), k = ease.out(prog(t, o.t0, .6));
    if (k > 0) {
      const p = ((t - o.t0) % 1.1) / 1.1, live = t < o.t0 + 2.2;
      if (live) { ctx.beginPath(); ctx.arc(x, y, 10 + 24 * ease.out(p), 0, 7); ctx.strokeStyle = `rgba(231,181,75,${(1 - p) * .9})`; ctx.lineWidth = 3; ctx.stroke(); }
      const r = (6 + 5 * k) * (t > 43.7 ? lerp(1, .8, prog(t, 43.7, 2)) : 1);
      ctx.beginPath(); ctx.arc(x, y, r + 3.5, 0, 7); ctx.fillStyle = "#fff"; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = "#E7B54B"; ctx.fill();
    }
    const a = ease.out(prog(t, o.t0 + .2, .6)) * (1 - ease.out(prog(t, o.exit, .6)));
    const w = o.lbl.offsetWidth, h = o.lbl.offsetHeight;
    let lx = x + 28, ly = y - h / 2 - 4;
    if (o.side === "l") lx = x - 28 - w;
    if (o.side === "bl") { lx = x - w + 10; ly = y + 20; }
    if (o.side === "br") { lx = x - 10; ly = y + 20; }
    o.lbl.style.left = lx + "px"; o.lbl.style.top = ly + (1 - a) * 10 + "px"; o.lbl.style.opacity = a;
  });

  // overview inset while zoomed in
  const ia = clamp((z - 1.4) / .8);
  if (ia > 0) {
    const ix = 1710, iy = 80, ik = 34, ilat = 7.35, ilon = 72.55, iw = 1.3 * ik, ih = 8.2 * ik;
    ctx.globalAlpha = ia;
    ctx.fillStyle = "rgba(2,20,30,.55)"; ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(ix - 14, iy - 14, iw + 28, ih + 28, 10); ctx.fill(); ctx.stroke();
    ctx.drawImage(shallows, ix + (TX.lon0 - ilon) * ik, iy + (ilat - TX.lat0) * ik, shallows.width * ik / TX.ppd, shallows.height * ik / TX.ppd);
    isl.forEach(o => { if (t >= o.t0) { ctx.beginPath(); ctx.arc(ix + (o.lon - ilon) * ik, iy + (ilat - o.lat) * ik, 2.6, 0, 7); ctx.fillStyle = "#E7B54B"; ctx.fill(); } });
    const v0 = [ix + (c[1] - CX / c[2] - ilon) * ik, iy + (ilat - (c[0] + CY / c[2])) * ik];
    const v1 = [ix + (c[1] + (W - CX) / c[2] - ilon) * ik, iy + (ilat - (c[0] - (H - CY) / c[2])) * ik];
    const x0 = Math.max(v0[0], ix - 12), x1 = Math.min(v1[0], ix + iw + 12);
    ctx.strokeStyle = "#E7B54B"; ctx.lineWidth = 2; ctx.strokeRect(x0, v0[1], x1 - x0, v1[1] - v0[1]);
    ctx.globalAlpha = 1;
  }

  // final title + list
  document.getElementById("shade").style.opacity = ease.out(prog(t, T_TITLE - .4, 1.2));
  fadeUp(document.getElementById("big"), t, T_TITLE, 1.0, 20);
  document.getElementById("rule").style.transform = `scaleX(${ease.out(prog(t, T_TITLE + .5, .8))})`;
  rows.forEach((r, i) => fadeUp(r, t, T_TITLE + .9 + i * .12, .6, 8));
};
window.render(0);
</script>
</body></html>
