</div>

<script type="module">

const farmId = new URLSearchParams(location.search).get("farm") || "1";

const W = 1920, H = 1080, DPR = window.devicePixelRatio || 1;
const GLOW = "#5FE0FF";

const CONF = {
  "1": { eyebrow: "SAMPLE FARM 01", title: "Breadfruit &amp; Watermelon" },

  "3": { eyebrow: "SAMPLE FARM 03", title: "Lemon" },
  "4": { eyebrow: "SAMPLE FARM 04", title: "Moringa" },

document.getElementById("eyebrow").textContent = CONF.eyebrow;
document.getElementById("title").innerHTML = CONF.title;

// ---------------- renderer / scene ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(DPR); renderer.setSize(W, H);

  const t = await new THREE.TextureLoader().loadAsync("../assets/backdrop_blur.jpg");
  t.colorSpace = THREE.SRGBColorSpace; scene.background = t;

const camera = new THREE.PerspectiveCamera(30, W / H, 1, 3000);
scene.add(new THREE.HemisphereLight("#BFD8FF", "#2C3E2C", 1.25));
const sun = new THREE.DirectionalLight("#FFF1DC", 2.5);
sun.position.set(-120, 110, 70); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -90, right: 90, top: 90, bottom: -90, near: 10, far: 500 });
sun.shadow.bias = -0.0015; sun.shadow.normalBias = 0.35; scene.add(sun);
const rim = new THREE.DirectionalLight("#6FC8FF", .9); rim.position.set(90, 60, -120); scene.add(rim);

const composer = new EffectComposer(renderer);
composer.setPixelRatio(DPR); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), .85, .55, .82));
composer.addPass(new OutputPass());

const rng1 = rng(11 + +farmId);
const X = (u) => u - 50, Z = (v) => v - 50;
const M = 2.6, S = 100 + 2 * M, ENT = 28;           // ENT: entrance strip depth (m) in front of the planting
const zBack = -S / 2, zFront = S / 2 + ENT, xL = -S / 2, xR = S / 2, zMid = (zBack + zFront) / 2;
const GATE = [-5, 5];

// ---------------- helpers ----------------
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t;
}
function speckle(g, w, h, base, spots, n, seed = 5) {
  g.fillStyle = base; g.fillRect(0, 0, w, h); const r = rng(seed);
  for (let i = 0; i < n; i++) { g.fillStyle = spots[Math.floor(r() * spots.length)]; g.globalAlpha = .25 + r() * .35;
    g.beginPath(); g.arc(r() * w, r() * h, 1 + r() * 3.5, 0, 7); g.fill(); } g.globalAlpha = 1;
}
const lineMats = [];
function glowLine(points, width = 3, color = GLOW, opacity = 1) {
  const geo = new LineGeometry(); geo.setPositions(points.flat());
  const mat = new LineMaterial({ color, linewidth: width, transparent: true, opacity, depthWrite: false });
  mat.resolution.set(W, H); lineMats.push(mat);
  const l = new Line2(geo, mat); l.computeLineDistances(); scene.add(l); return l;
}
// progressively reveal a polyline (k: 0..1)
function partial(points, k) {
  const segs = []; let total = 0;
  for (let i = 1; i < points.length; i++) { const d = Math.hypot(...points[i].map((v, j) => v - points[i - 1][j])); segs.push(d); total += d; }
  let left = total * k; const out = [points[0]];
  for (let i = 1; i < points.length && left > 0; i++) {
    const f = Math.min(1, left / segs[i - 1]); out.push(points[i - 1].map((v, j) => v + (points[i][j] - v) * f)); left -= segs[i - 1];
  }
  if (out.length < 2) out.push(points[0].map(v => v + 1e-4));
  return out;
}

// ---------------- diorama block: soil cross-section with glowing grid ----------------
const BW = S + 10, BD = (zFront - zBack) + 10, BH = 16;
const sideMap = canvasTex(1024, 256, (g, w, h) => {
  const bands = [["#3E2A1B", .16], ["#5A3D26", .22], ["#7B5A39", .2], ["#B79C6C", .2], ["#D9C9A0", .22]];
  let y = 0; for (const [c, f] of bands) { g.fillStyle = c; g.fillRect(0, y, w, h * f + 1); y += h * f; }
  const r = rng(9); for (let i = 0; i < 9000; i++) { g.fillStyle = r() < .5 ? "rgba(0,0,0,.18)" : "rgba(255,255,255,.12)"; g.fillRect(r() * w, r() * h, 2, 2); }
});
const sideGlow = canvasTex(1024, 256, (g, w, h) => {
  g.fillStyle = "#000"; g.fillRect(0, 0, w, h); g.strokeStyle = "#3FB8E8"; g.lineWidth = 2;
  for (let x = 0; x <= w; x += 64) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }

const block = new THREE.Mesh(new THREE.BoxGeometry(BW, BH, BD), [sideMat, sideMat, topMat, sideMat, sideMat, sideMat]);
block.position.set(0, -BH / 2, zMid); block.receiveShadow = true; scene.add(block);
const plotTex = canvasTex(1024, 1024, (g, w, h) => speckle(g, w, h, "#7DAE55", ["#6A9C46", "#94C067", "#80B058", "#A3C977"], 34000));

  glowLine([[bx0, yb, bz1], [bx1, yb, bz1], [bx1, yb, bz0]], 2),
  glowLine([[bx0, y0, bz1], [bx0, yb, bz1]], 2), glowLine([[bx1, y0, bz1], [bx1, yb, bz1]], 2), glowLine([[bx1, y0, bz0], [bx1, yb, bz0]], 2),
];

// ---------------- boundary fence with entrance gap ----------------
const fencePath = [[GATE[1], .9, zFront], [xR, .9, zFront], [xR, .9, zBack], [xL, .9, zBack], [xL, .9, zFront], [GATE[0], .9, zFront]];
const fenceLine = glowLine(fencePath.slice(0, 2), 3.2);
const postPts = [];
for (let i = 1; i < fencePath.length; i++) {
  const [a, b] = [fencePath[i - 1], fencePath[i]], L = Math.hypot(b[0] - a[0], b[2] - a[2]);
  for (let d = 0; d < L; d += 4) postPts.push({ x: a[0] + (b[0] - a[0]) * d / L, z: a[2] + (b[2] - a[2]) * d / L, f: 0 });
}
postPts.forEach((p, i) => p.f = i / postPts.length);
const postMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(.18, 1.1, .18), new THREE.MeshStandardMaterial({ color: "#2A3A44", roughness: .7 }), postPts.length);
postMesh.castShadow = true; scene.add(postMesh);
// gate posts with glowing caps
const gate = new THREE.Group();
for (const gx of GATE) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(.6, 2.6, .6), new THREE.MeshStandardMaterial({ color: "#35444F" })); p.position.set(gx, 1.3, zFront); p.castShadow = true;
  const cap = new THREE.Mesh(new THREE.BoxGeometry(.7, .18, .7), new THREE.MeshStandardMaterial({ color: GLOW, emissive: GLOW, emissiveIntensity: 2.5 })); cap.position.set(gx, 2.7, zFront);
  gate.add(p, cap);
}
scene.add(gate);

// ---------------- instanced crops ----------------
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3(), tmpP = new THREE.Vector3(), v3 = new THREE.Vector3();
const groups = [];
function part(geo, color, local = new THREE.Matrix4(), opts = {}) {

}
function addGroup(parts, items, dur = .8) {
  const g = { items, dur, parts: parts.map(p => {
    const mesh = new THREE.InstancedMesh(p.geo, p.mat, items.length); mesh.castShadow = mesh.receiveShadow = true; mesh.frustumCulled = false;
    if (p.vary) items.forEach((it, i) => mesh.setColorAt(i, new THREE.Color(p.vary[Math.floor(rng1() * p.vary.length)])));
    scene.add(mesh); return { mesh, local: p.local };
  }) };
  groups.push(g); return g;
}
const L = (x, y, z, sx = 1, sy = sx, sz = sx, rx = 0, ry = 0, rz = 0) =>
  new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new THREE.Vector3(sx, sy, sz));
const sphere = new THREE.IcosahedronGeometry(1, 2), sphereLo = new THREE.IcosahedronGeometry(1, 1);
const cyl = new THREE.CylinderGeometry(1, 1, 1, 10), cone = new THREE.ConeGeometry(1, 1, 8), box = new THREE.BoxGeometry(1, 1, 1);
const MODELS = {
  breadfruit: [
    part(cyl, "#6B4A2E", L(0, 1.4, 0, .38, 2.8, .38)),
    part(sphere, "", L(0, 4.2, 0, 2.2, 1.9, 2.2), { vary: ["#3B7D3F", "#367539", "#418645"] }),
    part(sphere, "#4C9047", L(1.0, 3.7, .6, 1.6, 1.35, 1.6)), part(sphere, "#4C9047", L(-.9, 3.85, -.7, 1.65, 1.4, 1.65)),
    part(sphere, "#6BAA55", L(-.25, 5.1, .25, 1.15, .95, 1.15)),
  ],
  melon: [part(sphere, "", L(0, .15, 0, 1.5, .42, 1.5), { vary: ["#6FAF4E", "#79B856", "#64A346"] }), part(sphere, "#2C6A34", L(.55, .4, .35, .62, .48, .82, 0, .6, 0))],
  palm: [
    part(cyl, "#8A6B48", L(.25, 3.1, 0, .2, 6.2, .2, 0, 0, -.08)),
    ...[0, 1, 2, 3, 4, 5, 6].map(i => part(box, i % 2 ? "#3D8A3F" : "#2F7535",
      new THREE.Matrix4().compose(new THREE.Vector3(.5, 6.1, 0), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, i / 7 * Math.PI * 2, -.38, "YXZ")), new THREE.Vector3(1, 1, 1)).multiply(L(1.5, 0, 0, 3.0, .07, .62)))),
    part(sphere, "#6B7A2E", L(.5, 5.8, 0, .45)),
  ],
  lemon: [
    part(cyl, "#6B4A2E", L(0, .6, 0, .16, 1.2, .16)),
    part(sphere, "", L(0, 2.1, 0, 1.85, 1.65, 1.85), { vary: ["#3C7F43", "#357640", "#438A49", "#2F6E3B"] }),
    part(sphere, "#5C9D52", L(-.5, 2.7, .4, 1.0, .8, 1.0)),
    part(sphereLo, "#F2C94C", L(1.35, 2.0, .9, .2)), part(sphereLo, "#F2C94C", L(-1.2, 1.7, 1.1, .2)),
    part(sphereLo, "#F2C94C", L(.4, 2.6, -1.5, .2)), part(sphereLo, "#F2C94C", L(-.9, 2.4, -1.2, .19)),
  ],
  moringa: [
    part(cyl, "#8C7355", L(0, 1.3, 0, .1, 2.6, .1)),
    part(sphereLo, "", L(0, 3.1, 0, 1.0, .75, 1.0), { flat: true, vary: ["#7BB35A", "#86BC63", "#6FA850"] }),
    part(sphereLo, "#8FC46A", L(.9, 2.7, .3, .75, .55, .75), { flat: true }), part(sphereLo, "#6FA850", L(-.8, 2.8, -.4, .8, .6, .8), { flat: true }),
    part(sphereLo, "#8FC46A", L(.2, 2.6, -.95, .7, .5, .7), { flat: true }), part(sphereLo, "#7BB35A", L(-.3, 2.5, 1.0, .7, .5, .7), { flat: true }),
  ],
  passion: [
    part(box, "#7A5A3A", L(0, .95, 0, .12, 1.9, .12)),
    part(sphereLo, "", L(0, 1.55, 0, .9, .7, .9), { flat: true, vary: ["#6FAA45", "#79B34E", "#62A03E"] }),
    part(sphereLo, "#6A2C66", L(.55, 1.2, .35, .16)), part(sphereLo, "#6A2C66", L(-.45, 1.35, -.4, .15)),
  ],
};

// ---------------- timeline ----------------
const T = {}; let cursor = 1.0;
T.border = cursor; cursor += 2.0; T.title = 1.2;
const rowsV = [...new Set(D.trees.map(p => p[1]))].sort((a, b) => a - b);
const colsU = [...new Set(D.trees.map(p => p[0]))].sort((a, b) => a - b);
const treeModel = { "1": "breadfruit", "2": "palm", "3": "lemon", "4": "moringa" }[farmId];
T.tree = cursor; const treeDur = 4.4;
const TREE_SCALE = { "1": 1.5, "2": 1.35, "3": 1.22, "4": 1.3 }[farmId];
addGroup(MODELS[treeModel], D.trees.map(([u, v]) => {
  const ri = rowsV.indexOf(v), ci = colsU.indexOf(u);
  const d = farmId === "2" ? (ci / colsU.length) * .75 + (ri / rowsV.length) * .25
          : farmId === "3" ? (ri / rowsV.length) * .8 + (ci % 2) * .06 + (ci / colsU.length) * .14
          : (ri / rowsV.length) * .85 + (ci / colsU.length) * .15;
  return { x: X(u), z: Z(v), rot: rng1() * 6.28, s: (.92 + rng1() * .16) * TREE_SCALE, t0: T.tree + d * (treeDur - .8) };
}), .9);
cursor += treeDur + .3;
if (D.intercrop) {
  T.inter = cursor;
  addGroup(MODELS.melon, D.intercrop.map(([u, v]) => ({ x: X(u), z: Z(v), rot: rng1() * 6.28, s: 1.2 + rng1() * .2, t0: T.inter + v / 100 * 2.6 + u / 100 * .3 })), .6);
  cursor += 3.3;
}
const beds = [];
if (D.beds) {
  const bedSoil = new THREE.MeshStandardMaterial({ color: "#6E4B30", roughness: 1 });
  for (const kind of ["beans", "okra"]) {
    T["beds-" + kind] = cursor; const plants = [];
    D.beds.filter(b => b.kind === kind).forEach(b => {
      const t0 = cursor + (kind === "beans" ? b.x / 46 : (b.x - 54) / 46) * 1.8 + b.y / 100 * .5;
      const m = new THREE.Mesh(box, bedSoil); m.receiveShadow = true; scene.add(m);
      beds.push({ m, x: X(b.x + b.w / 2), z: Z(b.y), len: b.h, t0 });
      for (let k = .5; k < b.h; k += .75) plants.push({ x: X(b.x + b.w / 2), z: Z(b.y + k), rot: rng1() * 6.28, s: .85 + rng1() * .3, t0: t0 + .3 + k / b.h * .5 });
    });
    addGroup(kind === "beans" ? [part(sphereLo, "", L(0, .42, 0, .42, .4, .42), { flat: true, vary: ["#86C25A", "#7AB651", "#93CB66"] })]
                              : [part(cone, "", L(0, .75, 0, .36, 1.5, .36), { flat: true, vary: ["#2F7A4A", "#2A6F43", "#358451"] })], plants, .5);
    cursor += 2.6;
  }
}
T.perim = cursor;
const hedgePts = [];
{ const path = [[GATE[1] + 1, zFront - 1.2], [xR - 1.2, zFront - 1.2], [xR - 1.2, zBack + 1.2], [xL + 1.2, zBack + 1.2], [xL + 1.2, zFront - 1.2], [GATE[0] - 1, zFront - 1.2]];
  let acc = 0; const segL = []; for (let i = 1; i < path.length; i++) segL.push(Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]));
  const total = segL.reduce((x, y) => x + y, 0);
  for (let i = 1; i < path.length; i++) { const [a0, b0] = [path[i - 1], path[i]], L0 = segL[i - 1];
    for (let d = 0; d < L0; d += 1.15) { hedgePts.push({ x: a0[0] + (b0[0] - a0[0]) * d / L0, z: a0[1] + (b0[1] - a0[1]) * d / L0, f: (acc + d) / total }); } acc += L0; } }
const perimPts = hedgePts.map(p => [p.x, p.z]);
addGroup([
  part(box, "#6B5038", L(0, 1.4, 0, .1, 2.8, .1)),                                                    // trellis post
  part(sphereLo, "", L(0, 1.9, 0, 1.0, 1.35, .75), { flat: true, vary: ["#4E9A3A", "#5BA845", "#447F33", "#62AE4A"] }),
  part(sphereLo, "", L(.3, 1.0, .05, .85, .95, .7), { flat: true, vary: ["#3F8A33", "#4C9A3C", "#58A646"] }),
  part(sphereLo, "", L(-.25, 2.75, 0, .7, .55, .6), { flat: true, vary: ["#6BB552", "#5FA848"] }),
  part(sphereLo, "#B39BE6", L(.45, 2.2, .55, .13)), part(sphereLo, "#5E2B5C", L(-.4, 1.4, .55, .16)), part(sphereLo, "#E8D45A", L(.2, .9, -.6, .12)),
], hedgePts.map(p => ({ x: p.x, z: p.z, rot: rng1() * 6.28, s: .9 + rng1() * .25, t0: T.perim + p.f * 2.4 })), .6);
cursor += 3.0;

// pump + glowing irrigation network
T.water = cursor;
const pumpPos = [X(-M), Z(D.pump[1])];

    // column position: beside the plot
    const px = bx, py = by + (1 - a) * 10;
    l.p.style.left = px + "px"; l.p.style.top = py + "px"; l.p.style.opacity = a;
    l.nd.style.left = x + "px"; l.nd.style.top = y + "px"; l.nd.style.opacity = a;
    const ax = px + w / 2, ay = py + ph, elbow = "";
    l.ln.setAttribute("points", `${x},${y} ${elbow}${ax},${ay}`); l.ln.style.opacity = a;
  });
  if (CALLOUT) {
    const el = document.getElementById("callout"); v3.set(CALLOUT.x, 2, CALLOUT.z).project(camera);
    const k = ease.out(prog(t, CALLOUT.t0 + 1.2, .7)) * (1 - ease.inOut(prog(t, CALLOUT.t0 + 3.6, .8))), R = 230 * k;
    el.style.width = el.style.height = 2 * R + "px"; el.style.left = ((v3.x + 1) / 2 * W + 320 - R) + "px"; el.style.top = ((1 - v3.y) / 2 * H - 120 - R) + "px"; el.style.opacity = k > .01 ? 1 : 0;
  }
};
if (new URLSearchParams(location.search).get("hud") === "0") document.querySelectorAll("#head,#pins,#leaders,#note").forEach(e => e.style.display = "none");
window.render(0);
</script>
